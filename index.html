<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinterklaas Surprise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: one full-screen 3D stage on a night-blue "baseplate"; title top-left, hint bottom; poem opens as an airmail postcard. */
  :root {
    --night: #0d2350;
    --night-deep: #071634;
    --red: #b40000;
    --yellow: #fac80a;
    --blue: #1e5aa8;
    --paper: #fffdf6;
    --ink: #1b1e27;
    --ink-soft: #5a6072;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --font-hand: "Kalam", "Bradley Hand", "Segoe Print", cursive;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1.5px, transparent 2px) 0 0 / 22px 22px,
      radial-gradient(120% 90% at 50% 30%, #1a3d82 0%, var(--night) 45%, var(--night-deep) 100%);
    color: #fff;
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #stage.dragging { cursor: grabbing; }
  #stage.over-hatch { cursor: pointer; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .eyebrow {
    font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--yellow);
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: clamp(30px, 6vw, 52px); line-height: 1; text-wrap: balance;
    text-shadow: 0 3px 0 var(--red), 0 6px 18px rgba(0,0,0,.35);
  }
  .sub { margin: 0; font-size: 15px; color: rgba(255,255,255,.78); max-width: 34ch; }

  .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: calc(100% - 32px); max-width: 420px; text-align: center;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(7,22,52,.72); border: 2px solid rgba(255,255,255,.14);
    padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--red); box-shadow: 0 0 0 0 rgba(180,0,0,.7); animation: ping 1.6s infinite; flex: none; }
  @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(180,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(180,0,0,0); } }
  .fallback {
    background: none; border: 0; color: rgba(255,255,255,.6); font: 600 13px var(--font-body);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 8px;
  }
  .fallback:focus-visible, .close:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 6px; }

  /* Poem postcard */
  .backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(4,12,30,.6);
    display: grid; place-items: center;
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .postcard {
    width: 100%; max-width: 780px; max-height: 100%;
    display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
    transform: translateY(40px) scale(.9) rotate(-3deg);
    transition: transform .55s cubic-bezier(.2,1.3,.4,1);
  }
  .backdrop.open .postcard { transform: rotate(-.6deg); }
  .card {
    width: 100%; min-height: 0; display: flex;
    padding: 9px; border-radius: 4px;
    background: repeating-linear-gradient(-45deg,
      var(--red) 0 14px, var(--paper) 14px 22px, var(--blue) 22px 36px, var(--paper) 36px 44px);
    box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 26px 60px rgba(0,0,0,.5);
  }
  .card-inner {
    flex: 1; min-width: 0; overflow-y: auto;
    max-height: calc(100dvh - 130px);
    background: var(--paper); color: var(--ink);
    display: grid; grid-template-columns: minmax(0, 1.4fr) 1px minmax(0, 1fr); gap: 26px;
    padding: 26px 28px;
  }
  .message { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .message p { margin: 0; font-family: var(--font-hand); font-size: 17.5px; line-height: 1.45; color: #23305c; }
  .sign { font-family: var(--font-hand); font-weight: 700; font-size: 24px; color: var(--red); margin-top: 2px; }
  .sign small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 800; color: var(--ink-soft); letter-spacing: .1em; text-transform: uppercase; }
  .divider { background: rgba(27,30,39,.22); }
  .address-side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; }
  .card-label { font: 400 22px var(--font-display); letter-spacing: .12em; color: var(--blue); text-transform: uppercase; line-height: 1; }
  .card-label small { display: block; margin-top: 6px; font: 800 10px var(--font-body); letter-spacing: .16em; color: var(--ink-soft); }
  .stamp {
    flex: none; padding: 6px; position: relative;
    background: radial-gradient(circle, transparent 3px, #fff 3.6px) -5px -5px / 10px 10px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); transform: rotate(2deg);
  }
  .stamp-inner {
    width: 78px; height: 94px; background: var(--blue); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 6px 4px; box-sizing: border-box; font: 800 9px var(--font-body); letter-spacing: .1em; text-transform: uppercase;
  }
  .stamp-inner b { font: 400 20px var(--font-display); letter-spacing: 0; color: var(--yellow); }
  .postmark {
    position: absolute; right: 46px; top: 62px; width: 74px; height: 74px; border-radius: 50%;
    border: 2px solid rgba(35,48,92,.55); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px rgba(35,48,92,.45);
    display: grid; place-items: center; text-align: center; transform: rotate(-14deg);
    font: 800 9px/1.25 var(--font-body); letter-spacing: .08em; color: rgba(35,48,92,.6); text-transform: uppercase;
    pointer-events: none;
  }
  .postmark::after {
    content: ""; position: absolute; left: 66px; top: 22px; width: 70px; height: 30px;
    background: repeating-linear-gradient(to bottom, rgba(35,48,92,.45) 0 2px, transparent 2px 9px);
    -webkit-mask: radial-gradient(18px 6px at 50% 50%, #000 60%, #000 100%);
    border-radius: 40%;
  }
  .address { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
  .address span {
    font-family: var(--font-hand); font-size: 18px; color: #23305c;
    border-bottom: 1.5px solid rgba(27,30,39,.25); padding: 4px 2px 3px; min-height: 1.4em;
  }
  .close {
    font: 400 18px var(--font-display); letter-spacing: .02em;
    background: var(--yellow); color: var(--ink); border: 0; border-radius: 6px;
    padding: 10px 20px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
  }
  .close:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }

  @media (max-width: 640px) {
    .card-inner { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1px auto; gap: 18px; padding: 20px 18px; }
    .address-side { order: -1; gap: 14px; }
    .divider { order: 0; height: 1px; }
    .message { order: 1; }
    .postmark { right: 50px; top: 62px; }
    .postmark::after { display: none; }
    .message p { font-size: 16.5px; }
  }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 700; color: rgba(255,255,255,.6); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .postcard, .backdrop { transition: none; }
  }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="3D surprise: a campervan built from bricks. Drag to rotate."></canvas>
<div class="loading" id="loading">The Piets are still building…</div>

<header>
  <span class="eyebrow">Sinterklaas Eve · 5 December</span>
  <h1>A surprise from Sinterklaas</h1>
  <p class="sub">Built brick by brick in Piet's workshop.</p>
</header>

<div class="hint">
  <span class="pill"><span class="dot" aria-hidden="true"></span><span id="hintText">Drag to rotate · tap the red hatch</span></span>
  <button class="fallback" id="openBtn" type="button">Can't open it? Show the poem</button>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="poemTitle">
  <article class="postcard">
    <div class="card">
      <div class="card-inner">
        <div class="message" id="poem"></div>
        <div class="divider" aria-hidden="true"></div>
        <div class="address-side">
          <div class="top-row">
            <h2 class="card-label" id="poemTitle">Postcard<small>Par avion · Spain → NL</small></h2>
            <div class="stamp" aria-hidden="true">
              <div class="stamp-inner">
                <span>Sint Post</span>
                <svg width="52" height="34" viewBox="0 0 52 34" aria-hidden="true">
                  <rect x="6" y="2" width="12" height="6" rx="1.5" fill="#fac80a"/>
                  <rect x="20" y="2" width="12" height="6" rx="1.5" fill="#fac80a"/>
                  <rect x="34" y="2" width="12" height="6" rx="1.5" fill="#fac80a"/>
                  <rect x="2" y="8" width="48" height="24" rx="2" fill="#fac80a"/>
                  <rect x="2" y="27" width="48" height="5" fill="#d9a800"/>
                </svg>
                <b>5¢</b>
              </div>
            </div>
            <div class="postmark" aria-hidden="true">Madrid<br>5 XII<br>2026</div>
          </div>
          <div class="address" id="address"></div>
        </div>
      </div>
    </div>
    <button class="close" id="closeBtn" type="button">Close hatch</button>
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== The poem: replace these verses with your own text ===== */
const POEM = [
  ["Sinterklaas sat in his study, deep in thought:",
   "what gift for this friend should this year be bought?",
   "A scarf, or a book, or some chocolate treats?",
   "No, the Saint knew much better than socks or sweets!"],
  ["For this friend, as the Saint has long known well,",
   "builds with bricks for hours, as if under a spell.",
   "A crane or a tractor, a van with a bed,",
   "in yellow and blue and a bright shade of red."],
  ["So Piet got to work with the bricks in his hand,",
   "and built him a camper, the finest in the land.",
   "With a bed and a door, in red, yellow and blue,",
   "made especially, my dear friend, just for you."],
  ["It won't fit in your shoe, it won't stand on a shelf,",
   "it rolls across your screen all by itself.",
   "So spin it around, every window and wheel,",
   "and plan a road trip! says the Saint. It's a deal!"]
];
const SIGNATURE = "Sint & Piet";
const SIGN_NOTE = "Sinterklaas Eve 2026";
const ADDRESS = ["To: my dear friend", "Brick Lane 5", "The Netherlands"];
/* =================================================================== */

(function renderPoem(){
  const el = document.getElementById('poem');
  POEM.forEach(lines => {
    const p = document.createElement('p');
    lines.forEach((l, j) => { if (j) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    el.appendChild(p);
  });
  const sign = document.createElement('div'); sign.className = 'sign';
  sign.textContent = SIGNATURE;
  const sm = document.createElement('small'); sm.textContent = SIGN_NOTE; sign.appendChild(sm);
  el.appendChild(sign);
  const addr = document.getElementById('address');
  ADDRESS.forEach(line => { const s = document.createElement('span'); s.textContent = line; addr.appendChild(s); });
})();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
const backdrop = document.getElementById('backdrop');

if (!window.THREE) {
  document.getElementById('loading').textContent = 'The 3D model could not load. Use the button below to read the poem.';
} else {
  document.getElementById('loading').hidden = true;
  init();
}

function init(){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
  const target = new THREE.Vector3(0, 2.6, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x303848, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.15);
  sun.position.set(10, 20, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x9fc2ff, 0.35);
  rim.position.set(-12, 8, -10);
  scene.add(rim);

  /* ---------- materials ---------- */
  const mat = {};
  const srgb = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const plastic = (hex) => new THREE.MeshStandardMaterial({ color: srgb(hex), roughness: 0.32, metalness: 0.0 });
  mat.red = plastic(0xb40000);
  mat.blue = plastic(0x1e5aa8);
  mat.yellow = plastic(0xfac80a);
  mat.black = plastic(0x1b2a34);
  mat.dark = plastic(0x646464);
  mat.light = plastic(0x969696);
  mat.white = plastic(0xf4f4f4);
  mat.green = plastic(0x00852b);
  mat.glass = new THREE.MeshStandardMaterial({ color: srgb(0xa9dcf5), roughness: 0.05, transparent: true, opacity: 0.45 });
  mat.lamp = new THREE.MeshStandardMaterial({ color: srgb(0xfff2a8), emissive: srgb(0xffd34d), emissiveIntensity: 0.6, roughness: 0.2 });
  mat.tail = new THREE.MeshStandardMaterial({ color: srgb(0xff4040), emissive: srgb(0xb00000), emissiveIntensity: 0.5, roughness: 0.2 });
  mat.hole = new THREE.MeshBasicMaterial({ color: 0x0a0a10 });

  const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 20);
  const truck = new THREE.Group();
  scene.add(truck);

  function shadowy(m){ m.castShadow = true; m.receiveShadow = true; return m; }

  // brick: w along x, d along z, h height; (x,z) centre, y bottom
  function brick(w, d, h, m, x, y, z, opts = {}){
    const g = new THREE.Group();
    const box = shadowy(new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, h, d - 0.04), m));
    box.position.y = h / 2;
    g.add(box);
    if (opts.studs !== false) {
      const nx = Math.round(w), nz = Math.round(d);
      for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
        const s = shadowy(new THREE.Mesh(studGeo, m));
        s.position.set(-w / 2 + 0.5 + i, h + 0.1, -d / 2 + 0.5 + j);
        g.add(s);
      }
    }
    g.position.set(x, y, z);
    (opts.parent || truck).add(g);
    return g;
  }

  /* ---------- baseplate ---------- */
  const baseW = 22, baseD = 16;
  const base = new THREE.Mesh(new THREE.BoxGeometry(baseW, 0.3, baseD), mat.green);
  base.position.y = -0.15; base.receiveShadow = true;
  scene.add(base);
  const baseStuds = new THREE.InstancedMesh(studGeo, mat.green, baseW * baseD);
  const dummy = new THREE.Object3D(); let k = 0;
  for (let i = 0; i < baseW; i++) for (let j = 0; j < baseD; j++) {
    dummy.position.set(-baseW / 2 + 0.5 + i, 0.1, -baseD / 2 + 0.5 + j);
    dummy.updateMatrix(); baseStuds.setMatrixAt(k++, dummy.matrix);
  }
  baseStuds.receiveShadow = true;
  scene.add(baseStuds);

  /* ---------- wheels: rubber tyre with tread + grey rim with axle hole ---------- */
  const wheels = [];
  const V2 = (x, y) => new THREE.Vector2(x, y);
  const lathe = (pts, seg = 40) => new THREE.LatheGeometry(pts, seg);
  const tyreGeo = lathe([
    V2(0.60, -0.38), V2(0.78, -0.41), V2(0.86, -0.39), V2(0.905, -0.34), V2(0.92, -0.26),
    V2(0.92, 0.26), V2(0.905, 0.34), V2(0.86, 0.39), V2(0.78, 0.41), V2(0.60, 0.38), V2(0.60, -0.38)
  ], 48);
  const treadGeo = new THREE.BoxGeometry(0.11, 0.3, 0.17);
  const rimGeo = lathe([
    V2(0.24, 0.30), V2(0.38, 0.30), V2(0.42, 0.25), V2(0.52, 0.25), V2(0.56, 0.33),
    V2(0.62, 0.34), V2(0.62, -0.34), V2(0.56, -0.33), V2(0.52, -0.25), V2(0.24, -0.25), V2(0.24, 0.30)
  ]);
  const hubGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.8, 28);
  const crossGeo = new THREE.BoxGeometry(0.26, 0.04, 0.07);
  const ringGeo = new THREE.TorusGeometry(0.47, 0.025, 6, 40);
  const rimMat = plastic(0xa0a5a9);
  const tyreMat = new THREE.MeshStandardMaterial({ color: srgb(0x1b2a34), roughness: 0.75, side: THREE.DoubleSide });
  const holeMat = new THREE.MeshBasicMaterial({ color: 0x0a0d10 });
  const N = 20;
  [4.3, -3.6].forEach(x => [-1, 1].forEach(side => {
    const w = new THREE.Group();
    const inner = new THREE.Group(); inner.rotation.x = Math.PI / 2; w.add(inner); // local +y points out of the truck
    inner.add(shadowy(new THREE.Mesh(tyreGeo, tyreMat)));
    for (let i = 0; i < N; i++) for (const row of [-1, 1]) {
      const a = (i + (row > 0 ? 0.5 : 0)) / N * Math.PI * 2;
      const t = shadowy(new THREE.Mesh(treadGeo, tyreMat));
      t.position.set(Math.cos(a) * 0.93, row * 0.17, Math.sin(a) * 0.93);
      t.rotation.y = -a;
      inner.add(t);
    }
    inner.add(shadowy(new THREE.Mesh(rimGeo, rimMat)));
    const hub = shadowy(new THREE.Mesh(hubGeo, rimMat)); hub.position.y = -0.02; inner.add(hub);
    const lip = new THREE.Mesh(ringGeo, rimMat); lip.rotation.x = Math.PI / 2; lip.position.y = 0.3; inner.add(lip);
    [0, Math.PI / 2].forEach(r => {           // cross-shaped axle hole
      const c = new THREE.Mesh(crossGeo, holeMat); c.rotation.y = r; c.position.y = 0.39; inner.add(c);
    });
    if (side < 0) w.rotation.y = Math.PI;
    w.position.set(x, 0.95, side * 2.15);
    truck.add(w); wheels.push(w);
  }));

  /* ---------- chassis ---------- */
  brick(12, 4, 0.4, mat.red, 0, 1.2, 0);              // chassis plate, top 1.6

  /* ---------- cab (blue) ---------- */
  brick(3, 4, 1.2, mat.blue, 4.5, 1.6, 0);             // lower cab, top 2.8
  brick(1, 4, 1.2, mat.blue, 3.5, 2.8, 0, { studs: false }); // back wall
  const glassFront = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 3.6), mat.glass));
  glassFront.position.set(5.88, 3.4, 0); truck.add(glassFront);
  [-1, 1].forEach(s => {
    const side = new THREE.Mesh(new THREE.BoxGeometry(1.95, 1.2, 0.2), mat.glass);
    side.position.set(4.98, 3.4, s * 1.88); truck.add(side);
    brick(0.2, 0.2, 1.2, mat.blue, 5.88, 2.8, s * 1.9, { studs: false });      // front pillars
  });
  brick(0.8, 1.2, 0.6, mat.black, 4.2, 2.8, 0.8, { studs: false });          // seat
  brick(0.3, 0.3, 0.7, mat.black, 5.0, 2.8, 0.8, { studs: false });          // steering column
  const wheelRing = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.06, 8, 20), mat.black);
  wheelRing.position.set(5.0, 3.5, 0.8); wheelRing.rotation.y = Math.PI / 2; wheelRing.rotation.x = 0.5; truck.add(wheelRing);
  brick(3, 4, 0.4, mat.blue, 4.5, 4.0, 0);             // roof, top 4.4
  // grille + headlights
  brick(0.1, 2.0, 0.8, mat.dark, 6.03, 1.8, 0, { studs: false });
  [-1.45, 1.45].forEach(z => {
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.12, 20), mat.lamp);
    l.rotation.z = Math.PI / 2; l.position.set(6.04, 2.25, z); truck.add(l);
  });

  /* ---------- camper floor ---------- */
  brick(9, 4, 0.4, mat.red, -1.5, 1.6, 0);             // floor, top 2.0
  [-1.2, 1.2].forEach(z => {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.5), mat.tail);
    t.position.set(-6.03, 1.4, z); truck.add(t);
  });

  /* ---------- living box (yellow with a red stripe) ---------- */
  brick(9, 4, 0.8, mat.yellow, -1.5, 2.0, 0, { studs: false });
  brick(9, 4, 0.4, mat.red, -1.5, 2.8, 0, { studs: false });       // stripe
  brick(9, 4, 2.0, mat.yellow, -1.5, 3.2, 0, { studs: false });    // top 5.2
  brick(2, 4, 0.8, mat.yellow, 4.0, 4.4, 0, { studs: false });     // sleeping alcove over the cab
  brick(11, 4, 0.4, mat.red, -0.5, 5.2, 0);                        // roof, top 5.6
  brick(2, 2, 0.4, mat.glass, -3.0, 5.6, 0);                       // skylight
  const alcoveGlass = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.45, 2.8), mat.glass);
  alcoveGlass.position.set(5.0, 4.8, 0); truck.add(alcoveGlass);

  const interior = new THREE.MeshStandardMaterial({ color: srgb(0x1d2b45), roughness: 0.9 });
  function camperWindow(x, side, w, y = 4.15, h = 0.9){
    const z = side * 2.0;
    const back = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.02), interior);
    back.position.set(x, y, z + side * 0.005); truck.add(back);
    [-1, 1].forEach(s => {                       // white curtains, tied back
      const c = new THREE.Mesh(new THREE.BoxGeometry(w * 0.18, h * 0.9, 0.02), mat.white);
      c.position.set(x + s * w * 0.38, y, z + side * 0.02); truck.add(c);
    });
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), mat.glass);
    glass.position.set(x, y, z + side * 0.045); truck.add(glass);
  }
  camperWindow(-0.6, 1, 1.8);
  camperWindow(-4.0, -1, 2.0); camperWindow(-0.6, -1, 1.8); camperWindow(1.65, -1, 1.2);
  // rear window
  const rb = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.9, 1.4), interior); rb.position.set(-6.005, 4.15, 0.4); truck.add(rb);
  const rg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.9, 1.4), mat.glass); rg.position.set(-6.045, 4.15, 0.4); truck.add(rg);

  // entry door (blue) with a small window, handle and step
  const doorPanel = shadowy(new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.6, 0.08), mat.blue));
  doorPanel.position.set(1.65, 3.4, 2.03); truck.add(doorPanel);
  const dwb = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.55, 0.02), interior); dwb.position.set(1.65, 4.15, 2.075); truck.add(dwb);
  const dwg = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.55, 0.04), mat.glass); dwg.position.set(1.65, 4.15, 2.1); truck.add(dwg);
  const dh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.2, 12), mat.yellow);
  dh.rotation.x = Math.PI / 2; dh.position.set(1.12, 3.3, 2.13); truck.add(dh);
  const step = shadowy(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.12, 0.4), mat.light));
  step.position.set(1.65, 1.75, 2.15); truck.add(step);

  // rolled-up awning above the door side
  const awning = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 4.6, 20), mat.blue));
  awning.rotation.z = Math.PI / 2; awning.position.set(0.3, 5.0, 2.14); truck.add(awning);
  [-2.0, 2.6].forEach(x => {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.12, 20), mat.white);
    cap.rotation.z = Math.PI / 2; cap.position.set(x, 5.0, 2.14); truck.add(cap);
  });

  // ladder and spare wheel on the back
  [-1.65, -1.05].forEach(z => {
    const rail = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.07, 3.6, 0.07), mat.black));
    rail.position.set(-6.12, 3.8, z); truck.add(rail);
  });
  for (let y = 2.3; y < 5.6; y += 0.45) {
    const rung = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.6), mat.black);
    rung.position.set(-6.12, y, -1.35); truck.add(rung);
  }
  const spare = shadowy(new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.2, 12, 28), mat.black));
  spare.rotation.y = Math.PI / 2; spare.position.set(-6.25, 2.9, 0.75); truck.add(spare);
  const spareHub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 20), mat.light);
  spareHub.rotation.z = Math.PI / 2; spareHub.position.set(-6.25, 2.9, 0.75); truck.add(spareHub);

  /* ---------- the surprise hatch ---------- */

  // dark opening behind the door
  const hole = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.55), mat.hole);
  hole.position.set(-4.0, 3.2, 2.0); truck.add(hole);

  // door texture with a question mark
  const tc = document.createElement('canvas'); tc.width = 256; tc.height = 200;
  const cx = tc.getContext('2d');
  cx.fillStyle = "#b40000"; cx.fillRect(0, 0, 256, 200);
  cx.strokeStyle = 'rgba(0,0,0,.22)'; cx.lineWidth = 8; cx.strokeRect(10, 10, 236, 180);
  cx.fillStyle = '#ffffff'; cx.font = 'bold 150px "Arial Rounded MT Bold", Arial, sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('?', 128, 108);
  const doorTex = new THREE.CanvasTexture(tc); doorTex.encoding = THREE.sRGBEncoding;
  const doorFace = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.32, emissive: 0xff2020, emissiveIntensity: 0 });
  const doorSide = new THREE.MeshStandardMaterial({ color: srgb(0xb40000), roughness: 0.32, emissive: 0xff2020, emissiveIntensity: 0 });

  const hinge = new THREE.Group();
  hinge.position.set(-5.15, 3.2, 2.1);
  truck.add(hinge);
  const doorW = 2.3, doorH = 1.8;
  const door = shadowy(new THREE.Mesh(new THREE.BoxGeometry(doorW, doorH, 0.16),
    [doorSide, doorSide, doorSide, doorSide, doorFace, doorSide]));
  door.position.x = doorW / 2; hinge.add(door);
  const knob = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.25, 14), mat.yellow));
  knob.rotation.x = Math.PI / 2; knob.position.set(doorW - 0.28, 0, 0.15); hinge.add(knob);
  [0.55, -0.55].forEach(y => {
    const h = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.4, 10), mat.dark);
    h.position.set(0.02, y, 0.05); hinge.add(h);
  });
  const hatchTargets = [door, knob];

  // the poem postcard hidden inside
  const pcCanvas = document.createElement('canvas'); pcCanvas.width = 512; pcCanvas.height = 320;
  (function drawPostcard(g){
    const W = 512, H = 320;
    g.fillStyle = '#fffdf6'; g.fillRect(0, 0, W, H);
    // airmail border
    g.save(); g.beginPath(); g.rect(0, 0, W, H); g.rect(14, 14, W - 28, H - 28); g.clip('evenodd');
    const cols = ['#b40000', '#fffdf6', '#1e5aa8', '#fffdf6'];
    for (let i = -H, k = 0; i < W + H; i += 11, k++) {
      g.fillStyle = cols[k % 4]; g.beginPath();
      g.moveTo(i, 0); g.lineTo(i + 11, 0); g.lineTo(i + 11 - H, H); g.lineTo(i - H, H); g.closePath(); g.fill();
    }
    g.restore();
    // divider
    g.fillStyle = 'rgba(27,30,39,.25)'; g.fillRect(292, 40, 2, 240);
    // handwriting squiggles on the message side
    g.strokeStyle = '#23305c'; g.lineWidth = 2.4; g.lineCap = 'round';
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let row = 0; row < 9; row++) {
      if (row === 4) continue;
      const y = 52 + row * 25, len = 160 + rnd() * 80;
      g.beginPath(); g.moveTo(36, y);
      for (let x = 36; x < 36 + len; x += 6) g.lineTo(x, y + Math.sin(x * 0.5 + row) * 3.2 + (rnd() - .5) * 2);
      g.stroke();
    }
    g.fillStyle = '#b40000'; g.font = 'bold 26px "Comic Sans MS", cursive'; g.fillText('Sint & Piet', 120, 290);
    // stamp with perforations
    g.fillStyle = '#ffffff'; g.fillRect(398, 34, 86, 100);
    g.fillStyle = '#fffdf6';
    for (let x = 398; x <= 484; x += 9) { g.beginPath(); g.arc(x, 34, 3.5, 0, 7); g.arc(x, 134, 3.5, 0, 7); g.fill(); }
    for (let y = 34; y <= 134; y += 9) { g.beginPath(); g.arc(398, y, 3.5, 0, 7); g.arc(484, y, 3.5, 0, 7); g.fill(); }
    g.fillStyle = '#1e5aa8'; g.fillRect(405, 41, 72, 86);
    g.fillStyle = '#fac80a'; g.fillRect(415, 76, 52, 24);
    [419, 434, 449].forEach(x => g.fillRect(x, 70, 12, 6));
    // postmark
    g.strokeStyle = 'rgba(35,48,92,.6)'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(380, 120, 34, 0, 7); g.stroke();
    g.beginPath(); g.arc(380, 120, 27, 0, 7); g.stroke();
    for (let i = 0; i < 4; i++) {
      g.beginPath(); g.moveTo(312, 104 + i * 10);
      for (let x = 312; x < 350; x += 4) g.lineTo(x, 104 + i * 10 + Math.sin(x * 0.3) * 2.5);
      g.stroke();
    }
    // address lines
    g.fillStyle = 'rgba(27,30,39,.3)';
    [200, 232, 264].forEach(y => g.fillRect(312, y, 168, 2));
    g.strokeStyle = '#23305c'; g.lineWidth = 2.2;
    [192, 224, 256].forEach((y, i) => {
      g.beginPath(); g.moveTo(318, y);
      for (let x = 318; x < 318 + [130, 100, 120][i]; x += 6) g.lineTo(x, y + Math.sin(x * 0.55) * 3);
      g.stroke();
    });
  })(pcCanvas.getContext('2d'));
  const pcTex = new THREE.CanvasTexture(pcCanvas); pcTex.encoding = THREE.sRGBEncoding; pcTex.anisotropy = 4;
  const pcPaper = new THREE.MeshStandardMaterial({ color: srgb(0xfffdf6), roughness: 0.8 });
  const scroll = shadowy(new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.03),
    [pcPaper, pcPaper, pcPaper, pcPaper, new THREE.MeshStandardMaterial({ map: pcTex, roughness: 0.8 }), pcPaper]));
  scroll.position.set(-4.0, 3.1, 1.4); scroll.visible = false;
  truck.add(scroll);

  truck.position.x = -0.2;

  /* ---------- camera orbit ---------- */
  let theta = 0.75, phi = 1.12, radius = 30, baseRadius = 30, zoom = 1;
  let vTheta = reduceMotion ? 0 : 0.0025, vPhi = 0;
  let interacted = false;

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    baseRadius = camera.aspect < 1 ? 30 / Math.max(camera.aspect, 0.42) * 0.72 : 30;
  }
  window.addEventListener('resize', resize); resize();

  function placeCamera(){
    radius = baseRadius * zoom;
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
  }

  /* ---------- pointer handling (mouse + touch + pinch) ---------- */
  const pointers = new Map();
  let downX = 0, downY = 0, moved = 0, lastX = 0, lastY = 0, pinchStart = 0, zoomStart = 1;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  function hitsHatch(clientX, clientY){
    ndc.set(clientX / window.innerWidth * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.intersectObjects(hatchTargets, false).length > 0;
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { downX = lastX = e.clientX; downY = lastY = e.clientY; moved = 0; }
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y); zoomStart = zoom; moved = 99;
    }
    vTheta = vPhi = 0; interacted = true;
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) {
      if (e.pointerType === 'mouse') canvas.classList.toggle("over-hatch", (!isOpen && hitsHatch(e.clientX, e.clientY)));
      return;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoom = THREE.MathUtils.clamp(zoomStart * pinchStart / Math.max(d, 1), 0.55, 1.6);
      return;
    }
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));
    const s = 0.008;
    theta -= dx * s; phi = THREE.MathUtils.clamp(phi - dy * s, 0.35, 1.5);
    vTheta = -dx * s * 0.6; vPhi = -dy * s * 0.6;
  });
  function endPointer(e){
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      canvas.classList.remove('dragging');
      if (moved < 8 && hitsHatch(e.clientX, e.clientY)) { vTheta = vPhi = 0; openHatch(); }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = THREE.MathUtils.clamp(zoom * (1 + e.deltaY * 0.001), 0.55, 1.6);
  }, { passive: false });
  canvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') theta += 0.15;
    else if (e.key === 'ArrowRight') theta -= 0.15;
    else if (e.key === 'ArrowUp') phi = Math.max(0.35, phi - 0.1);
    else if (e.key === 'ArrowDown') phi = Math.min(1.5, phi + 0.1);
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openHatch(); }
    else return;
    vTheta = vPhi = 0; interacted = true;
  });

  /* ---------- hatch + poem ---------- */
  let isOpen = false, hatchAngle = 0, hatchGoal = 0, scrollT = 0, scrollGoal = 0, poemTimer = 0;
  const hintText = document.getElementById('hintText');

  function openHatch(){
    if (isOpen) return;
    isOpen = true; hatchGoal = 1; scrollGoal = 1; scroll.visible = true;
    canvas.classList.remove('over-hatch');
    clearTimeout(poemTimer);
    poemTimer = setTimeout(() => {
      backdrop.classList.add('open');
      document.getElementById('closeBtn').focus({ preventScroll: true });
    }, reduceMotion ? 0 : 900);
  }
  function closePoem(){
    backdrop.classList.remove('open');
    hatchGoal = 0; scrollGoal = 0;
    setTimeout(() => { isOpen = false; }, 600);
    hintText.textContent = 'Read it again? Tap the hatch';
    canvas.focus({ preventScroll: true });
  }
  window.__openHatch = openHatch; window.__closePoem = closePoem;

  /* ---------- loop ---------- */
  const clock = new THREE.Clock();
  function frame(){
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (!pointers.size) {
      theta += vTheta; phi = THREE.MathUtils.clamp(phi + vPhi, 0.35, 1.5);
      if (interacted) { vTheta *= 0.94; vPhi *= 0.9; }
    }
    placeCamera();

    const ease = 1 - Math.pow(0.001, dt);
    hatchAngle += (hatchGoal - hatchAngle) * ease * 1.4;
    hinge.rotation.y = -hatchAngle * 1.95;
    scrollT += (scrollGoal - scrollT) * ease * (scrollGoal ? 0.9 : 2);
    scroll.position.z = 1.4 + scrollT * 1.6;
    scroll.position.y = 3.1 + scrollT * 0.9 + (scrollT > 0.6 && !reduceMotion ? Math.sin(t * 3) * 0.06 : 0);
    scroll.rotation.x = -scrollT * 0.35;
    scroll.rotation.y = scrollT * 0.15;
    if (scrollGoal === 0 && scrollT < 0.02) scroll.visible = false;

    const glow = isOpen || reduceMotion ? 0 : (Math.sin(t * 3.2) * 0.5 + 0.5) * 0.45;
    doorFace.emissiveIntensity = doorSide.emissiveIntensity = glow;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
}

/* buttons work even if 3D failed */
document.getElementById('openBtn').addEventListener('click', () => {
  if (window.__openHatch) window.__openHatch(); else backdrop.classList.add('open');
});
document.getElementById('closeBtn').addEventListener('click', () => {
  if (window.__closePoem) window.__closePoem(); else backdrop.classList.remove('open');
});
backdrop.addEventListener('click', e => { if (e.target === backdrop) document.getElementById('closeBtn').click(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('open')) document.getElementById('closeBtn').click(); });
</script>
</body>
</html>
