<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinterklaas Surprise</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: one full-screen 3D stage on a night-blue "baseplate"; title top-left, hint bottom; poem opens as an airmail postcard. */
  :root {
    --night: #0d2350;
    --night-deep: #071634;
    --red: #b40000;
    --yellow: #fac80a;
    --blue: #1e5aa8;
    --paper: #fffdf6;
    --ink: #1b1e27;
    --ink-soft: #5a6072;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --font-hand: "Kalam", "Bradley Hand", "Segoe Print", cursive;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1.5px, transparent 2px) 0 0 / 22px 22px,
      radial-gradient(120% 90% at 50% 30%, #1a3d82 0%, var(--night) 45%, var(--night-deep) 100%);
    color: #fff;
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #stage.dragging { cursor: grabbing; }
  #stage.over-hatch { cursor: pointer; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .eyebrow {
    font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--yellow);
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: clamp(30px, 6vw, 52px); line-height: 1; text-wrap: balance;
    text-shadow: 0 3px 0 var(--red), 0 6px 18px rgba(0,0,0,.35);
  }
  .sub { margin: 0; font-size: 15px; color: rgba(255,255,255,.78); max-width: 34ch; }

  .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: calc(100% - 32px); max-width: 420px; text-align: center;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(7,22,52,.72); border: 2px solid rgba(255,255,255,.14);
    padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--red); box-shadow: 0 0 0 0 rgba(180,0,0,.7); animation: ping 1.6s infinite; flex: none; }
  @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(180,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(180,0,0,0); } }
  .fallback {
    background: none; border: 0; color: rgba(255,255,255,.6); font: 600 13px var(--font-body);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 8px;
  }
  .fallback:focus-visible, .close:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 6px; }

  /* Poem postcard */
  .backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(4,12,30,.6);
    display: grid; place-items: center;
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .postcard {
    width: 100%; max-width: 780px; max-height: 100%;
    display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
    transform: translateY(40px) scale(.9) rotate(-3deg);
    transition: transform .55s cubic-bezier(.2,1.3,.4,1);
  }
  .backdrop.open .postcard { transform: rotate(-.6deg); }
  .card {
    width: 100%; min-height: 0; display: flex;
    padding: 9px; border-radius: 4px;
    background: repeating-linear-gradient(-45deg,
      var(--red) 0 14px, var(--paper) 14px 22px, var(--blue) 22px 36px, var(--paper) 36px 44px);
    box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 26px 60px rgba(0,0,0,.5);
  }
  .card-inner {
    flex: 1; min-width: 0; overflow-y: auto;
    max-height: calc(100dvh - 130px);
    background: var(--paper); color: var(--ink);
    display: grid; grid-template-columns: minmax(0, 1.4fr) 1px minmax(0, 1fr); gap: 26px;
    padding: 26px 28px;
  }
  .message { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .message p { margin: 0; font-family: var(--font-hand); font-size: 17.5px; line-height: 1.45; color: #23305c; }
  .sign { font-family: var(--font-hand); font-weight: 700; font-size: 24px; color: var(--red); margin-top: 2px; }
  .sign small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 800; color: var(--ink-soft); letter-spacing: .1em; text-transform: uppercase; }
  .divider { background: rgba(27,30,39,.22); }
  .address-side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; }
  .card-label { font: 400 22px var(--font-display); letter-spacing: .12em; color: var(--blue); text-transform: uppercase; line-height: 1; }
  .card-label small { display: block; margin-top: 6px; font: 800 10px var(--font-body); letter-spacing: .16em; color: var(--ink-soft); }
  .stamp {
    flex: none; padding: 6px; position: relative;
    background: radial-gradient(circle, transparent 3px, #fff 3.6px) -5px -5px / 10px 10px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); transform: rotate(2deg);
  }
  .stamp-inner {
    width: 78px; height: 94px; background: var(--blue); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 6px 4px; box-sizing: border-box; font: 800 9px var(--font-body); letter-spacing: .1em; text-transform: uppercase;
  }
  .stamp-inner b { font: 400 20px var(--font-display); letter-spacing: 0; color: var(--yellow); }
  .postmark {
    position: absolute; right: 46px; top: 62px; width: 74px; height: 74px; border-radius: 50%;
    border: 2px solid rgba(35,48,92,.55); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px rgba(35,48,92,.45);
    display: grid; place-items: center; text-align: center; transform: rotate(-14deg);
    font: 800 9px/1.25 var(--font-body); letter-spacing: .08em; color: rgba(35,48,92,.6); text-transform: uppercase;
    pointer-events: none;
  }
  .postmark::after {
    content: ""; position: absolute; left: 66px; top: 22px; width: 70px; height: 30px;
    background: repeating-linear-gradient(to bottom, rgba(35,48,92,.45) 0 2px, transparent 2px 9px);
    -webkit-mask: radial-gradient(18px 6px at 50% 50%, #000 60%, #000 100%);
    border-radius: 40%;
  }
  .address { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
  .address span {
    font-family: var(--font-hand); font-size: 18px; color: #23305c;
    border-bottom: 1.5px solid rgba(27,30,39,.25); padding: 4px 2px 3px; min-height: 1.4em;
  }
  .close {
    font: 400 18px var(--font-display); letter-spacing: .02em;
    background: var(--yellow); color: var(--ink); border: 0; border-radius: 6px;
    padding: 10px 20px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
  }
  .close:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }

  @media (max-width: 640px) {
    .card-inner { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1px auto; gap: 18px; padding: 20px 18px; }
    .address-side { order: -1; gap: 14px; }
    .divider { order: 0; height: 1px; }
    .message { order: 1; }
    .postmark { right: 50px; top: 62px; }
    .postmark::after { display: none; }
    .message p { font-size: 16.5px; }
  }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 700; color: rgba(255,255,255,.6); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .postcard, .backdrop { transition: none; }
  }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="3D surprise: a campervan built from bricks. Drag to rotate."></canvas>
<div class="loading" id="loading">The Piets are still building…</div>

<header>
  <span class="eyebrow">Sinterklaas Eve · 5 December</span>
  <h1>A surprise from Sinterklaas</h1>
  <p class="sub">Cut, taped and colored in Piet's workshop.</p>
</header>

<div class="hint">
  <span class="pill"><span class="dot" aria-hidden="true"></span><span id="hintText">Drag to rotate · tap the blue back doors</span></span>
  <button class="fallback" id="openBtn" type="button">Can't open it? Show the poem</button>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="poemTitle">
  <article class="postcard">
    <div class="card">
      <div class="card-inner">
        <div class="message" id="poem"></div>
        <div class="divider" aria-hidden="true"></div>
        <div class="address-side">
          <div class="top-row">
            <h2 class="card-label" id="poemTitle">Postcard<small>Par avion · Spain → NZ</small></h2>
            <div class="stamp" aria-hidden="true">
              <div class="stamp-inner">
                <span>Sint Post</span>
                <svg width="52" height="34" viewBox="0 0 52 34" aria-hidden="true">
                  <rect x="6" y="2" width="12" height="6" rx="1.5" fill="#fac80a"/>
                  <rect x="20" y="2" width="12" height="6" rx="1.5" fill="#fac80a"/>
                  <rect x="34" y="2" width="12" height="6" rx="1.5" fill="#fac80a"/>
                  <rect x="2" y="8" width="48" height="24" rx="2" fill="#fac80a"/>
                  <rect x="2" y="27" width="48" height="5" fill="#d9a800"/>
                </svg>
                <b>5¢</b>
              </div>
            </div>
            <div class="postmark" aria-hidden="true">Madrid<br>5 XII<br>2026</div>
          </div>
          <div class="address" id="address"></div>
        </div>
      </div>
    </div>
    <button class="close" id="closeBtn" type="button">Close doors</button>
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== The poem: replace these verses with your own text ===== */
const POEM = [
  [`Sinterklaas sat in Madrid with his book:`,
   `"Where's our friend gone, Piet? Come and take a look!"`,
   `"He's off in New Zealand," said Piet with a grin,`,
   `"he'll be home in Norway when New Year comes in."`],
  [`The Sint's big red book has a page about you:`,
   `it says you play LEGO, which grown men don't do!`,
   `You stop in the street when a crane passes by,`,
   `and stare at a dump truck with love in your eye.`],
  [`At the gym, so says Piet, you lift and you train,`,
   `you're built like a truck, with the arms of a crane.`,
   `But Piet also saw that between every set,`,
   `your eyes drift to men... not the dumbbells, I bet!`],
  [`Now you're driving New Zealand in camper-van style,`,
   `past sheep and volcanoes, mile after mile.`,
   `Do the Kiwi boys wave when you drive by the bay?`,
   `The Sint hopes you waved back at least once a day!`],
  [`So Piet built a camper from cardboard and tape,`,
   `just like your own, only much smaller in shape.`,
   `Enjoy every mile, then come home through the snow,`,
   `and save us the stories that no one should know!`]
];
const SIGNATURE = "Sint & Piet";
const SIGN_NOTE = "Sinterklaas Eve 2026";
const ADDRESS = ["To: my dear friend", "Somewhere in a camper van", "New Zealand"];
/* =================================================================== */

(function renderPoem(){
  const el = document.getElementById('poem');
  POEM.forEach(lines => {
    const p = document.createElement('p');
    lines.forEach((l, j) => { if (j) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    el.appendChild(p);
  });
  const sign = document.createElement('div'); sign.className = 'sign';
  sign.textContent = SIGNATURE;
  const sm = document.createElement('small'); sm.textContent = SIGN_NOTE; sign.appendChild(sm);
  el.appendChild(sign);
  const addr = document.getElementById('address');
  ADDRESS.forEach(line => { const s = document.createElement('span'); s.textContent = line; addr.appendChild(s); });
})();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
const backdrop = document.getElementById('backdrop');

if (!window.THREE) {
  document.getElementById('loading').textContent = 'The 3D model could not load. Use the button below to read the poem.';
} else {
  document.getElementById('loading').hidden = true;
  init();
}

function init(){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
  const target = new THREE.Vector3(0, 2.6, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x303848, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.15);
  sun.position.set(10, 20, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x9fc2ff, 0.35);
  rim.position.set(-12, 8, -10);
  scene.add(rim);

  /* ---------- materials ---------- */
  /* ---------- cardboard, marker and tape materials ---------- */
  const srgb = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
  const KRAFT = '#c79d6b';
  const PPU = 56;                                     // texture pixels per stud unit
  function rng(seed){ let s = (seed >>> 0) || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
  function hashStr(str){ let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

  function paintKraft(g, W, H, r){
    g.fillStyle = KRAFT; g.fillRect(0, 0, W, H);
    const n = Math.max(40, (W * H) / 140);
    for (let i = 0; i < n; i++) {                     // paper fibres and specks
      const x = r() * W, y = r() * H, l = 2 + r() * 9, a = r() * Math.PI;
      g.strokeStyle = r() < 0.5 ? 'rgba(90,60,30,.16)' : 'rgba(255,235,200,.18)';
      g.lineWidth = 0.6 + r();
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  }
  function paintMarker(g, W, H, color, r){
    const lw = Math.max(7, PPU * 0.3);
    const inset = () => 1 + r() * 4;
    g.save();
    g.beginPath(); g.rect(inset(), inset(), W - 2 * inset(), H - 2 * inset()); g.clip();
    g.strokeStyle = color; g.lineCap = 'round'; g.lineWidth = lw;
    const a = -0.62 + r() * 0.2, dx = Math.cos(a), dy = Math.sin(a), px = -dy, py = dx;
    const R = Math.hypot(W, H) / 2 + lw, cx = W / 2, cy = H / 2;
    for (let t = -R; t < R; t += lw * (0.55 + r() * 0.3)) {
      g.globalAlpha = 0.62 + r() * 0.28;
      const ox = cx + px * t, oy = cy + py * t, wob = (r() - 0.5) * 3;
      g.beginPath(); g.moveTo(ox - dx * R, oy - dy * R + wob); g.lineTo(ox + dx * R, oy + dy * R - wob); g.stroke();
    }
    g.restore(); g.globalAlpha = 1;
  }
  function paintOutline(g, W, H, r){
    const lw = Math.max(3, PPU * 0.075), m = lw * 0.9 + 1;
    g.strokeStyle = '#17140f'; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = lw; g.globalAlpha = 0.92;
    const edge = (x0, y0, x1, y1) => {
      const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
      const o0 = r() * lw * 1.6, o1 = r() * lw * 1.6, steps = Math.max(2, Math.round(len / 14));
      g.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = -o0 + (len + o0 + o1) * i / steps, j = (r() - 0.5) * 1.6;
        const x = x0 + ux * t - uy * j, y = y0 + uy * t + ux * j;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    };
    edge(m, m, W - m, m); edge(W - m, m, W - m, H - m); edge(W - m, H - m, m, H - m); edge(m, H - m, m, m);
    g.globalAlpha = 1;
  }
  const texCache = new Map();
  function cardTex(color, wu, hu, outline){
    const W = Math.min(1024, Math.max(24, Math.round(wu * PPU))), H = Math.min(1024, Math.max(24, Math.round(hu * PPU)));
    const key = `${color}|${W}|${H}|${outline}`;
    if (texCache.has(key)) return texCache.get(key);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), r = rng(hashStr(key));
    paintKraft(g, W, H, r);
    if (color) paintMarker(g, W, H, color, r);
    if (outline) paintOutline(g, W, H, r);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = MAX_ANISO;
    texCache.set(key, t); return t;
  }
  const matCache = new Map();
  function cardMat(color, wu = 1, hu = 1, outline = false, extra = {}){
    const key = `${color}|${wu.toFixed(2)}|${hu.toFixed(2)}|${outline}|${JSON.stringify(extra)}`;
    if (!extra.noCache && matCache.has(key)) return matCache.get(key);
    const { noCache, ...props } = extra;
    const m = new THREE.MeshStandardMaterial(Object.assign({ map: cardTex(color, wu, hu, outline), roughness: 0.95, metalness: 0 }, props));
    m.userData.hex = color;
    if (!extra.noCache) matCache.set(key, m);
    return m;
  }
  // box faces in BoxGeometry order: +x, -x, +y, -y, +z, -z
  function boxMats(color, w, h, d){
    const sx = cardMat(color, d, h, true), sy = cardMat(color, w, d, true), sz = cardMat(color, w, h, true);
    return [sx, sx, sy, sy, sz, sz];
  }
  const studCache = new Map();
  function studMats(color){
    if (studCache.has(color)) return studCache.get(color);
    const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), r = rng(hashStr('stud' + color));
    paintKraft(g, S, S, r);
    g.save(); g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 4, 0, Math.PI * 2); g.clip();
    paintMarker(g, S, S, color, r); g.restore();
    g.strokeStyle = '#17140f'; g.lineWidth = 3.2; g.globalAlpha = 0.9;
    g.beginPath(); g.arc(S / 2 + 0.6, S / 2 - 0.4, S / 2 - 4.5, 0.2, Math.PI * 2 + 0.45); g.stroke(); g.globalAlpha = 1;
    const top = new THREE.CanvasTexture(c); top.encoding = THREE.sRGBEncoding; top.anisotropy = MAX_ANISO;
    const topMat = new THREE.MeshStandardMaterial({ map: top, roughness: 0.95 });
    const res = [cardMat(color, 1.9, 0.2, false), topMat, topMat];
    studCache.set(color, res); return res;
  }

  const C = { red: '#d3261d', blue: '#2361c4', yellow: '#f4c81a', black: '#26221d', dark: '#5d5a55', light: '#a9a7a2', white: '#f6f1e4', green: '#2e9a45' };
  const mat = {};
  Object.entries(C).forEach(([k, v]) => { mat[k] = cardMat(v, 1, 1, false); });
  mat.glass = new THREE.MeshStandardMaterial({ color: srgb(0xd8eef7), roughness: 0.25, transparent: true, opacity: 0.35 });
  mat.lamp = cardMat('#ffe27a', 0.6, 0.6, true, { emissive: srgb(0xffd34d), emissiveIntensity: 0.35, noCache: true });
  mat.tail = cardMat(C.red, 0.5, 0.3, true, { emissive: srgb(0xb00000), emissiveIntensity: 0.25, noCache: true });
  mat.hole = new THREE.MeshBasicMaterial({ color: 0x1a120a });

  // masking tape: translucent beige with torn ends
  const tapeTex = (() => {
    const W = 256, H = 64, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), r = rng(77);
    g.beginPath(); g.moveTo(6, 0);
    for (let y = 0; y <= H; y += 6) g.lineTo(2 + r() * 8, y);
    for (let y = H; y >= 0; y -= 6) g.lineTo(W - 2 - r() * 8, y);
    g.closePath(); g.fillStyle = 'rgba(236,222,178,.82)'; g.fill();
    g.save(); g.clip();
    for (let i = 0; i < 26; i++) {            // crinkles
      g.strokeStyle = r() < 0.5 ? 'rgba(150,120,70,.18)' : 'rgba(255,250,230,.35)'; g.lineWidth = 1;
      const x = r() * W; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (r() - 0.5) * 30, H); g.stroke();
    }
    g.restore();
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = MAX_ANISO; return t;
  })();

    requestAnimationFrame(frame);
  }
  frame();
}

/* buttons work even if 3D failed */
document.getElementById('openBtn').addEventListener('click', () => {
  if (window.__openHatch) window.__openHatch(); else backdrop.classList.add('open');
});
document.getElementById('closeBtn').addEventListener('click', () => {
  if (window.__closePoem) window.__closePoem(); else backdrop.classList.remove('open');
});
backdrop.addEventListener('click', e => { if (e.target === backdrop) document.getElementById('closeBtn').click(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('open')) document.getElementById('closeBtn').click(); });
</script>
